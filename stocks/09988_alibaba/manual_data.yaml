# ── 估值调整说明（2026-05-14）──────────────────────────
#
# 【下调原因】
# 1. 非GAAP净利从1581亿→607亿（-62%），远低于预期
# 2. 自由现金流转负（-466亿），从+739亿大幅恶化
# 3. 即时零售（闪购）仍在大量投入，EBITA下降40%
# 4. All Others亏损从34亿→428亿（扩大11倍）
#
# 【维持因素】
# 1. 营收破万亿（10237亿），同口径+11%仍健康
# 2. 云智能+38%且AI进入商业化回报周期
# 3. 88VIP 6200万护城河深厚
# 4. 现金5208亿，弹药充裕
# 5. 国际业务接近盈亏平衡
#
# 【估值影响】
# - 核心商业PE给18-28倍（不变，CMR同口径+8%证明平台仍健康）
# - 云智能PE给30-45倍（不变，+38%增长确认商业化）
# - 国际商业PS给0.8倍（不变，接近盈亏平衡）
# - 但分部净利估算需要大幅下调（因为整体净利下降）
# ──────────────────────────────────────────────────────
