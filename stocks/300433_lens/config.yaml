methodology_notes:
  valuation_notes: |
    【定位说明】
    SOTP基准估值（13-17元）是保守估值，适合作为价值锚。
    当前市场价25.72元约等于PE 35x，反映市场对AI驱动换机潮的乐观预期。
    两者差异不是模型错误，而是保守SOTP基准 vs 市场成长溢价的正常偏离。
    
    【收入拆分说明】
    558亿玻璃主业 = 手机玻璃 + 平板/笔记本玻璃 + 智能手表玻璃
    95亿VR/可穿戴 = Apple Vision/Meta Quest/其他AR眼镜
    60亿汽车电子 = 新能源车中控屏 + 仪表盘 + 触控传感器
    31亿其他 = 陶瓷/蓝宝石外观件 + 金属小件
    
    【净利缺口说明】
    模型净利合计（调整前43.67亿）vs 年报归母净利40.18亿，差距3.49亿。
    原因：母子公司关联交易利润在合并报表时抵消。
    config中profit_adjustment = -3.5亿作为调整项。

  terminal_growth:
    value: 0.03
    assumption: "消费电子行业成熟，增速约等于CPI+手机出货量增速"

  wacc:
    risk_free_rate:
