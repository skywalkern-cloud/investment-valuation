# 蓝思科技(HK06613) 估值模型配置
# SOTP + DCF + 概率加权估值（港币HKD）

meta:
  stock_code: "06613"
  stock_name: "蓝思科技"
  market: "HK"
  total_shares: 52.79        # 亿股（A股+H股合计）
  h_share_count: 3.02        # H股亿股（已发行H股）
  a_share_count: 49.77       # A股亿股
  last_updated: "2026-04-30"
  current_price_hkd: 16.70
  current_price_cny: 15.36   # 16.70 × 0.92
  hkd_cny_rate: 0.92
  currency: "HKD"

# ============================================================
# 财务数据来源（2025年报）
# ============================================================
#   - 合并营收/净利/EPS/ROE/净利率: 2025年报（港币HKD）
#     来源: 港交所披露易 https://www.hkexnews.hk → 搜"蓝思科技"
#     或: 东方财富港股数据中心 https://data.eastmoney.com/hk
#
#   - 分部营收拆分（玻璃主业/VR/汽车/其他）:
#     来源: 公司年报营收分部说明 + 机构研报估算（2025年报）
#
#   - 实时股价: 腾讯行情 API (hk06613)
#
#   - 实时市值/PE等: 由实时股价 × 总股本计算得出
# ============================================================

financial_data:
  base_year: "2025"           # 基准财报年份
  report_type: "年报(港币HKD)"  # 报表类型
  data_sources:
    - name: "港交所披露易"
      url: "https://www.hkexnews.hk"
      description: "2025年报（蓝思科技H股）"
    - name: "东方财富港股数据"
      url: "https://data.eastmoney.com/hk"
      description: "港股实时行情及财务摘要"
  key_metrics:
    revenue_hkd: 744.10       # 亿元HKD（2025年报合并营收）
    net_profit_hkd: 40.18     # 亿元HKD（2025归母净利润）
    eps_hkd: 0.79             # 元HKD（EPS摊薄）
    roe: 7.75                 # %（2025年报）
    net_margin: 5.43          # %（净利率）
    gross_margin: 22.5         # %（毛利率，参考值）
  segment_revenue_hkd:        # 2025年报分部营收（公司披露+估算）
    glass_main: 558.0         # 亿元HKD（消费电子玻璃主业）
    vr_ar: 95.0               # 亿元HKD（VR/AR/可穿戴）
    automotive: 60.0          # 亿元HKD（汽车电子）
    other: 31.0               # 亿元HKD（陶瓷/蓝宝石/金属其他）
  segment_notes: |
    分部营收由2025年报披露的分部毛利结构推算，
    由于港交所不强制披露详细分部营收，采用了公司年报
    中的文字说明 + 主流券商研报估算值。
    汇率统一用 1 HKD = 0.92 CNY（2026-04参考）。

events:
  - name: "AI手机换机潮带动玻璃盖板需求"
    probability: 0.70
    impact: "positive"
    magnitude: 1.20
    description: "苹果/安卓旗舰AI功能落地，刺激换机需求，玻璃用量增加"

  - name: "VR/AR产品放量"
    probability: 0.50
    impact: "positive"
    magnitude: 1.15
    description: "Apple Vision Pro迭代/Meta Quest 4等VR/AR产品上量"

  - name: "汽车中控玻璃业务突破"
    probability: 0.40
    impact: "positive"
    magnitude: 1.10
    description: "新能源车中控屏渗透率提升，ASP是手机3-5倍"

  - name: "消费电子需求持续疲软"
    probability: 0.35
    impact: "negative"
    magnitude: 0.85
    description: "手机市场连续下滑，出货量不及预期"

  - name: "竞争加剧导致净利率下滑"
    probability: 0.30
    impact: "negative"
    magnitude: 0.80
    description: "行业竞争恶化，净利率从5.5%跌破4%"

plugins:
  # 注意：PE区间已调整为港股科技股合理区间（相对A股溢价）
  - type: "electronics"
    name: "消费电子玻璃主业"
    weight: 0.75
    pe_min: 15
    pe_max: 22
    pe_base: 18
    note: "手机/平板玻璃盖板，核心客户苹果+安卓旗舰；PE给18x（港股消费电子龙头的合理估值）"

  - type: "electronics"
    name: "VR/AR/可穿戴"
    weight: 0.13
    pe_min: 20
    pe_max: 30
    pe_base: 25
    note: "Apple Vision/Meta Quest/智能手表，2026年望放量；PE给25x反映港股对新兴业务的更高溢价"

  - type: "electronics"
    name: "汽车电子"
    weight: 0.08
    pe_min: 18
    pe_max: 28
    pe_base: 22
    note: "新能源车中控屏、仪表盘玻璃，增速快但体量小；PE给22x"

  - type: "electronics"
    name: "其他（陶瓷/蓝宝石/金属）"
    weight: 0.04
    pe_min: 8
    pe_max: 15
    pe_base: 12
    note: "陶瓷/蓝宝石/金属小件等"

methodology_notes:
  valuation_notes: |
    【定位说明】
    SOTP基准估值适合作为价值锚。市场给予蓝思的溢价反映了：
    1. 苹果产业链的确定性
    2. AI驱动换机潮的预期
    3. VR/汽车等新业务的成长性

    【收入拆分说明】
    558亿HKD玻璃主业 = 手机玻璃 + 平板/笔记本玻璃 + 智能手表玻璃
    95亿HKD VR/可穿戴 = Apple Vision/Meta Quest/其他AR眼镜
    60亿HKD汽车电子 = 新能源车中控屏 + 仪表盘 + 触控传感器
    31亿HKD其他 = 陶瓷/蓝宝石外观件 + 金属小件

    汇率: 1 HKD = 0.92 CNY（2026-04参考）

  terminal_growth:
    value: 0.03
    assumption: "消费电子行业成熟，增速约等于CPI+手机出货量增速"

  wacc:
    risk_free_rate:
      source: "10年期国债收益率"
      auto: true
      fallback: 0.030
    beta:
      value: 1.05        # 港股H股对A股折价，beta略低于A股（国际资金更理性）
      source: "历史Beta (1年滚动)"
      last_updated: "2026-04-30"
      expiry_days: 90
    market_premium: 0.07
    cost_of_debt: 0.050

sensitivity_analysis:
  sotp_params:
    消费电子净利HKD: [25, 30, 35, 42]
    VR/AR净利HKD: [0, 3, 6, 10]
  dcf_wacc_range: [0.075, 0.085, 0.095]
  dcf_tg_range: [0.02, 0.03, 0.04]
