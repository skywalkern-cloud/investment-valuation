# 乐鑫科技(688018) SOTP估值模型 - 配置文件
# 科创板物联网WiFi芯片龙头，A股（CNY）
# 最后一更新: 2026-05-15（从akshare东方财富API获取真实财务数据）
#
# 数据来源（akshare自动获取）:
#   - 利润表: akshare stock_financial_report_sina(stock='sh688018', symbol='利润表')
#   - 财务指标: akshare stock_financial_analysis_indicator(symbol='688018')
#   - 实时股价: 腾讯行情 API (sh688018)
#
# 真实财务数据（2026-05-15更新）:
#   2025年报(20251231): 营收25.65亿, 归母净利润4.98亿, EPS=3.152元
#   2024年报(20241231): 营收20.07亿, 归母净利润3.39亿, EPS=2.206元
#   2023年报(20231231): 营收14.33亿, 归母净利润1.36亿, EPS=1.215元

stock_info:
  name: 乐鑫科技
  code: "688018"
  market: A股 (科创板)
  currency: CNY
  exchange: SH
  symbol_tencent: "sh688018"
  total_shares: 1.67   # 亿股 (总股本)
  float_shares: 1.47   # 亿股 (流通股本)
  hkd_cny_rate: 0.92  # 不适用但保留

# 业务分部配置（SOTP）
# 乐鑫是纯Fabless，只做芯片设计和销售
# 根据公司财报+研报分析，分部收入估算如下：
segments:
  # WiFi MCU芯片（智能家居/工业控制/消费电子）
  # 2025年约19亿营收（+35% YoY），占比约75%，核心大本营
  # 乐鑫是WiFi MCU全球龙头，ESP8266/ESP32系列全球热销
  - name: "WiFi MCU主业"
    code: wifi_mcu
    revenue_cny: 19.0    # 2026E营收（亿元）
    net_margin: 0.20     # 净利率20%（产品结构改善）
    net_profit_cny: 3.80  # 19×20% = 3.80亿
    pe_min: 40
    pe_max: 60
    pe_base: 50
    notes: "WiFi6 MCU全球前三，智能家居/工业IoT绝对龙头，ESP32系列全球热销"

  # WiFi/蓝牙Combo芯片（手机配件/穿戴/AI眼镜/AR）
  - name: "WiFi/蓝牙Combo芯片"
    code: combo
    revenue_cny: 5.5     # 2026E营收（亿元）
    net_margin: 0.18     # 净利率18%（AI眼镜/AR新增长点）
    net_profit_cny: 0.99  # 5.5×18% = 0.99亿
    pe_min: 45
    pe_max: 65
    pe_base: 55
    notes: "Combo芯片进入AI眼镜/AR眼镜，2025年已有多个品牌采用"

  # BLE/Thread芯片（超低功耗IoT/智能家居Matter协议）
  - name: "BLE/Thread芯片"
    code: ble
    revenue_cny: 1.5     # 2026E营收（亿元）
    net_margin: 0.22     # 净利率22%（Thread/Matter未来爆发）
    net_profit_cny: 0.33  # 1.5×22% = 0.33亿
    pe_min: 50
    pe_max: 70
    pe_base: 60
    notes: "Thread/Matter协议，智能家居未来标准，2026年有望放量"

# 业绩基准（2025年报+2024年报对比）
# 2025年报(20251231): 营收25.65亿, 归母净利润4.98亿, EPS=3.152元
# 2024年报(20241231): 营收20.07亿, 归母净利润3.39亿, EPS=2.206元
# 2023年报(20231231): 营收14.33亿, 归母净利润1.36亿, EPS=1.215元
base_year: "2025"
base_revenue: 25.65     # 2025年报营收（亿元）
base_net_profit: 4.98  # 2025年报归母净利润（亿元）
shares: 1.67           # 总股本（亿股）

# 成长预期（2026-2028）
growth:
  wifi_mcu:
    rev_growth: 0.25   # WiFi MCU增长25%（智能家居渗透率提升）
    nm_improve: 0.02   # 净利率提升2%（产品结构升级）
  combo:
    rev_growth: 0.40   # Combo增长40%（AI眼镜/AR上量）
    nm_improve: 0.02
  ble:
    rev_growth: 0.60   # BLE增长60%（Matter协议爆发）
    nm_improve: 0.01

# DCF参数（保守估算）
dcf:
  wacc_base: 0.085     # WACC 8.5%（科创板高成长）
  wacc_min: 0.075
  wacc_max: 0.095
  tg: 0.03            # 永续增长率3%
  net_debt: -7.7      # 净现金约7.7亿（货币资金10.25亿-负债5.58亿）

# 敏感性分析
sensitivity_analysis:
  sotp:
    pe_wifi_range: [40, 60]
    pe_combo_range: [45, 65]
    pe_ble_range: [50, 70]
  dcf:
    wacc_range: [0.075, 0.095]
    tg_range: [0.02, 0.04]
    terminal_multiple: [15, 25]

# 事件驱动（概率加权）
events:
  - name: "智能家居/Matter协议爆发"
    probability: 0.65
    magnitude: 1.18  # 上涨18%
    impact: positive
    description: "Matter协议统一智能家居标准，乐鑫作为全球WiFi MCU龙头直接受益"

  - name: "AI眼镜/AR眼镜放量"
    probability: 0.50
    magnitude: 1.15  # 上涨15%
    impact: positive
    description: "Meta/Ray-Ban/苹果AI眼镜上量，Combo芯片（WiFi+BT）出货增加"

  - name: "WiFi7芯片量产"
    probability: 0.40
    magnitude: 1.12  # 上涨12%
    impact: positive
    description: "WiFi7芯片在高端智能家居场景量产，单价提升"

  # === 负向事件 ===
  - name: "竞争加剧/价格战"
    probability: 0.30
    magnitude: 0.82  # 下跌18%
    impact: negative
    description: "高通/联发科/瑞昱进入WiFi MCU市场，价格战压缩净利率"

  - name: "消费电子持续低迷"
    probability: 0.25
    magnitude: 0.88  # 下跌12%
    impact: negative
    description: "智能家居/消费电子需求低迷，主业净利率承压"

# 估值说明
methodology_notes: |
  - SOTP: 按业务分部估值，加权PE（中枢×净利润）
  - DCF: 基于2025年净利×增长率预测作为DCF起点
  - 概率加权: 不同情景下的SOTP市值加权平均
  - 核心逻辑: WiFi MCU全球前三，智能家居/Matter协议龙头，AIoT打开第二增长极

display_preferences:
  currency_symbol: "¥"
  price_precision: 2
  show_probability_weighted: true

