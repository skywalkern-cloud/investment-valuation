methodology_notes:
  version: "v2.0"
  core_logic: |
    云南锗业已经不是"挖矿股"，而是"AI算力底层材料瓶颈股"。
    1.6T光模块放量元年（2026），EML方案占60%+出货，InP供需缺口>70%
    全年锁定订单23万片，占当前产能(15万片)的153%
  valuation_framework:
    sotp: "SOTP分部估值（半导体材料 + 传统锗矿）"
    semi_pe: "60-80x（稀缺AI材料溢价）"
    trad_pe: "15-20x（传统矿业）"
  terminal_growth:
    value: 0.03
    assumption: "接近中国长期GDP增速"
  wacc:
    risk_free_rate:
      source: "10年期国债收益率"
      auto: true
      fallback: 0.025
    beta:
      value: 1.2
      source: "历史Beta (1年滚动)"
      last_updated: "2026-04-29"
      expiry_days: 90
    market_premium: 0.05
    cost_of_debt: 0.04

# ============================================================
# SOTP分部配置 v2.0
# ============================================================
sotp:
  # 半导体分部：磷化铟衬底
  semiconductor:
    name: "半导体材料分部（磷化铟衬底）"
    business: "InP衬底 → 光芯片 → 1.6T光模块"
    weight: 0.70  # 利润占比70%（AI材料贡献主要利润）
    pe_min: 60
    pe_max: 80
    pe_base: 70
    variables:
      产能_万片_年: 15        # 当前产能（扩产后45万片）
      产能利用率: 1.0         # 满产（订单超产能）
      InP衬底均价_万元_片: 2.65  # 2026年4月价格（已涨近3倍）
      毛利率: 0.45            # 45%
      净利率: 0.24            # 制造费用折算后约24%
      全年锁定订单_万片: 23    # 占当前产能153%（极度供不应求）
      扩产目标_万片_年: 45    # 2026年4月公告
      扩产投资_亿元: 1.89
    key_metrics:
      供需缺口: "全球>70%（EML方案1.6T占60%+出货）"
      客户: "华为、中际旭创、光迅科技（核心供应商）；Lumentum、Coherent（海外导入中）"
      技术节点: "1.6T认证已通过，进入量产阶段"
      价格趋势: "2025年初至今已涨近3倍"

  # 传统业务：锗矿开采冶炼
  traditional:
    name: "传统锗矿业务"
    business: "锗矿开采+冶炼一体化"
    weight: 0.30  # 利润占比30%
    pe_min: 15
    pe_max: 20
    pe_base: 18
    variables:
      锗金属产量_吨_年: 30     # 吨/年
      锗价_万元_公斤: 1.775      # 万元/公斤
      毛利率: 0.40
      净利率: 0.30
    key_metrics:
      行业地位: "国内锗矿储量前三，冶炼技术成熟"
      需求: "红外、光伏、军工（稳定但增速低）"

